# Producao do Painel 4Selet — painel (interno) + Caddy (borda: TLS + proxy) no IP publico.
# A autenticacao e o LOGIN DO PROPRIO PAINEL (lib/auth.js); o Caddy nao faz mais login.
# Subir com:  docker compose -f docker-compose.prod.yml up -d --build
services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"      # so na rede do compose; porta NAO publicada ao host
      PORT: "4500"
      # Opcional (recomendado): fixar o segredo de sessao e o admin inicial por env,
      # senao o volume ./interface/data abaixo ja persiste ambos entre rebuilds.
      # SESSION_SECRET: "<hex >=16 chars>"
      # ADMIN_USERNAME: "admin"
      # ADMIN_PASSWORD: "<senha forte>"
    volumes:
      - ./interface/.env:/app/interface/.env:ro   # chave Anthropic (fora do git)
      - ./interface/data:/app/interface/data      # usuarios + .session_secret — PERSISTE (senao todo login some a cada rebuild)
      - panel_outputs:/app/outputs                # drafts / trabalho em andamento
      - panel_uploads:/app/interface/public/uploads  # fotos enviadas (acervo "Foto") — PERSISTE (senao a foto some no rebuild)
      - ./outputs/approved:/app/outputs/approved  # conteudo APROVADO (fonte de verdade versionada em git)
      - ./outputs/archive:/app/outputs/archive    # conteudo arquivado (versionado em git)
    restart: unless-stopped
    # Sinal de vida: o painel pode ficar "vivo mas travado" (ex.: fila de render presa) — nesse
    # estado o processo nao morre, entao o restart sozinho nunca agia e o painel ficava fora do ar
    # ate alguem reclamar. Com healthcheck, da pra ver `unhealthy` no docker ps e automatizar.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4500/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Teto de memoria: um render do Remotion sem limite podia consumir a VPS inteira e derrubar
    # o Caddy junto (OOM do host). Assim so o painel e reiniciado.
    mem_limit: 3g
    # Rotacao de log: o driver padrao do Docker cresce sem limite e os renders escrevem bastante
    # em stdout/stderr — disco cheio derruba painel e Caddy de uma vez.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # sem 'ports:' -> so o Caddy alcança (nada exposto direto)

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/origin:/etc/caddy/origin:ro   # Cloudflare Origin Certificate (cert.pem + key.pem)
      - caddy_data:/data      # certificados (persistente — nao re-emitir a cada deploy)
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - panel
    # Este Caddy também atende squad.4st.co (serviço radar-web, de OUTRO projeto, na rede
    # radar-net). Essa ligação estava sendo feita À MÃO com `docker network connect`, fora do
    # compose: qualquer `up -d` recriava o contêiner sem a rede e derrubava o squad.4st.co com
    # 502, sem ninguém entender por quê. Declarada aqui para o deploy parar de ser destrutivo.
    networks:
      - default
      - radar-net

networks:
  radar-net:
    external: true   # criada pelo projeto do radar; aqui só nos conectamos a ela

volumes:
  panel_outputs:
  panel_uploads:
  caddy_data:
  caddy_config:
