<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  body { font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

  .card {
    position:relative;
    width:1080px; height:1350px;
    overflow:hidden;
    background:
      radial-gradient(128% 118% at 78% 6%, #006494 0%, #003554 45%, #07212B 100%);
    color:#fff;
  }

  /* subtle tech lines layer */
  .tech { position:absolute; inset:0; z-index:0; pointer-events:none; }

  /* faint vignette to deepen edges, keep it sober */
  .vignette {
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 55%, rgba(3,15,20,.42) 100%);
  }

  .content {
    position:relative; z-index:2;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center;
    padding:96px 90px 78px;
  }

  /* eyebrow */
  .eyebrow {
    font-family:'JetBrains Mono',monospace;
    font-weight:500;
    font-size:22px;
    letter-spacing:6.5px;
    text-transform:uppercase;
    color:#AFBCC9;
    display:flex; align-items:center; gap:16px;
  }
  .eyebrow .dash { width:34px; height:2px; background:#5499B5; opacity:.85; }

  /* title */
  .title {
    margin-top:26px;
    font-size:82px;
    line-height:.98;
    letter-spacing:-1.5px;
    text-align:center;
  }
  .title .brand { font-weight:900; color:#ffffff; }
  .title .rest  { font-weight:700; color:#5499B5; }

  .subtitle {
    margin-top:20px;
    font-size:24px;
    font-weight:400;
    letter-spacing:.2px;
    color:#AFBCC9;
    text-align:center;
    max-width:720px;
  }

  /* browser window */
  .browser {
    margin-top:64px;
    width:840px;
    border-radius:22px;
    overflow:hidden;
    background:#0d1418;
    box-shadow:
      0 44px 90px -28px rgba(0,0,0,.72),
      0 14px 34px -14px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.06);
  }

  .bar {
    height:66px;
    background:linear-gradient(180deg,#1a232a,#141b21);
    border-bottom:1px solid rgba(255,255,255,.06);
    display:flex; align-items:center;
    padding:0 22px;
    gap:20px;
  }
  .lights { display:flex; gap:11px; flex:0 0 auto; }
  .dot { width:15px; height:15px; border-radius:50%; }
  .dot.r { background:#ec6a5e; }
  .dot.y { background:#f4bf4f; }
  .dot.g { background:#61c554; }

  .address {
    flex:1;
    height:38px;
    background:#0b1216;
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    display:flex; align-items:center;
    padding:0 16px;
    gap:11px;
    color:#7f95a3;
    font-size:16px;
    font-weight:500;
    letter-spacing:.2px;
    overflow:hidden;
  }
  .address .lock { flex:0 0 auto; opacity:.9; }
  .address .url { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .address .url b { color:#cfd9df; font-weight:600; }

  .tabmenu { display:flex; gap:5px; flex:0 0 auto; opacity:.6; }
  .tabmenu span { width:4px; height:4px; border-radius:50%; background:#8aa0ad; }

  .viewport {
    position:relative;
    width:100%;
    height:520px;
    background:#ffffff;
    overflow:hidden;
  }
  .viewport img {
    width:100%; height:100%;
    display:block;
    object-fit:cover;
    object-position:top center;
  }

  /* footer */
  .footer {
    margin-top:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .rule {
    width:150px; height:1px;
    background:linear-gradient(90deg, rgba(84,153,181,0) 0%, rgba(84,153,181,.55) 50%, rgba(84,153,181,0) 100%);
  }
  .footer img { height:46px; display:block; }
</style>
</head>
<body>
  <div class="card">

    <svg class="tech" viewBox="0 0 1080 1350" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#5499B5" stroke-width="1.1" fill="none" opacity="0.15">
        <path d="M -40 250 L 300 250 L 360 310 L 700 310"/>
        <path d="M 1120 210 L 820 210 L 770 260 L 470 260"/>
        <path d="M -40 1120 L 250 1120 L 320 1050 L 640 1050"/>
        <path d="M 1120 1180 L 860 1180 L 800 1240 L 520 1240"/>
        <path d="M 940 60 L 940 190 L 1000 250"/>
        <path d="M 150 40 L 150 150"/>
      </g>
      <g fill="#5499B5" opacity="0.28">
        <circle cx="300" cy="250" r="3.4"/>
        <circle cx="700" cy="310" r="3.4"/>
        <circle cx="470" cy="260" r="3.4"/>
        <circle cx="250" cy="1120" r="3.4"/>
        <circle cx="640" cy="1050" r="3.4"/>
        <circle cx="1000" cy="250" r="3.4"/>
      </g>
      <g fill="#D9DCD6" opacity="0.10">
        <circle cx="120" cy="520" r="1.6"/>
        <circle cx="980" cy="470" r="1.6"/>
        <circle cx="90" cy="880" r="1.6"/>
        <circle cx="1000" cy="900" r="1.6"/>
      </g>
    </svg>

    <div class="vignette"></div>

    <div class="content">

      <div class="eyebrow">
        <span class="dash"></span>
        VALOR ECON&Ocirc;MICO &middot; PULSEBRAND
        <span class="dash"></span>
      </div>

      <h1 class="title">
        <span class="brand">4Selet</span> <span class="rest">na m&iacute;dia</span>
      </h1>

      <p class="subtitle">A 4Selet em destaque na imprensa econ&ocirc;mica.</p>

      <div class="browser">
        <div class="bar">
          <div class="lights">
            <span class="dot r"></span>
            <span class="dot y"></span>
            <span class="dot g"></span>
          </div>
          <div class="address">
            <svg class="lock" width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="11" width="14" height="9" rx="2" fill="#7f95a3"/>
              <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#7f95a3" stroke-width="2" fill="none"/>
            </svg>
            <span class="url"><b>valor.globo.com</b>/financas/pulsebrand/4selet</span>
          </div>
          <div class="tabmenu"><span></span><span></span><span></span></div>
        </div>
        <div class="viewport">
          <img src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/interface/public/uploads/valor_print.png" alt="Mat&eacute;ria do Valor Econ&ocirc;mico sobre a 4Selet">
        </div>
      </div>

      <div class="footer">
        <div class="rule"></div>
        <img src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/assets/logo-4selet-light.png" alt="4Selet">
      </div>

    </div>
  </div>
</body>
</html>
