<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .card{
    position:relative;width:1080px;height:1350px;overflow:hidden;
    background:radial-gradient(128% 118% at 78% 6%, #006494 0%, #003554 45%, #07212B 100%);
  }
  .tech{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  .vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(140% 120% at 50% 40%, rgba(7,33,43,0) 40%, rgba(7,33,43,.55) 100%)}
  .content{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
    padding:96px 96px 84px 96px}

  /* Topo: título */
  .header{display:flex;flex-direction:column;align-items:flex-start;gap:22px}
  .kicker{display:flex;align-items:center;gap:16px}
  .kicker .dot{width:9px;height:9px;border-radius:50%;background:#5499B5;box-shadow:0 0 0 5px rgba(84,153,181,.16)}
  .kicker span{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:19px;
    letter-spacing:.34em;text-transform:uppercase;color:#AFBCC9}
  .title{font-size:66px;line-height:1.02;letter-spacing:-.018em}
  .title b{font-weight:900;color:#ffffff}
  .title i{font-weight:700;font-style:normal;color:#5499B5}
  .rule{width:100%;height:1px;margin-top:6px;
    background:linear-gradient(90deg, rgba(175,188,201,.42) 0%, rgba(175,188,201,.10) 46%, rgba(175,188,201,0) 100%)}

  /* Corpo: pull-quote */
  .quote-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;padding-top:8px}
  .bigquote{position:absolute;top:-40px;left:-14px;font-family:'Inter',sans-serif;font-weight:900;
    font-size:340px;line-height:.7;color:#5499B5;opacity:.20;user-select:none;z-index:0}
  .quote{position:relative;z-index:1;font-weight:800;color:#ffffff;
    font-size:70px;line-height:1.12;letter-spacing:-.02em;max-width:840px}
  .quote em{font-style:normal;color:#5499B5;font-weight:800}
  .attrib{position:relative;z-index:1;display:flex;align-items:center;gap:20px;margin-top:44px}
  .attrib .line{width:56px;height:2px;background:#5499B5;flex:0 0 auto}
  .attrib .who{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:21px;
    letter-spacing:.16em;text-transform:uppercase;color:#AFBCC9}
  .attrib .who b{color:#D9DCD6;font-weight:500}

  /* Miniatura reta da matéria + rodapé */
  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
  .thumb{position:relative;flex:0 0 auto;width:246px;height:328px;border-radius:14px;overflow:hidden;
    background:#0b1418;
    box-shadow:0 34px 64px -22px rgba(0,0,0,.72), 0 0 0 1px rgba(175,188,201,.14),
      inset 0 0 0 1px rgba(255,255,255,.05);
    transform:translateY(2px)}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .thumb .gloss{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(118deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 34%)}
  .thumb .tag{position:absolute;left:0;bottom:0;right:0;padding:14px 16px 12px;
    background:linear-gradient(0deg, rgba(7,33,43,.9) 0%, rgba(7,33,43,0) 100%);
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:12.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#AFBCC9}
  .brand{display:flex;flex-direction:column;align-items:flex-end;gap:16px;padding-bottom:8px}
  .brand .note{font-size:18px;font-weight:600;color:#AFBCC9;letter-spacing:.01em;text-align:right;max-width:360px;line-height:1.4}
  .brand .note b{color:#D9DCD6;font-weight:700}
  .brand img{height:46px;width:auto;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
</style>
</head>
<body>
  <div class="card">
    <svg class="tech" viewBox="0 0 1080 1350" fill="none" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#5499B5" stroke-width="1" opacity=".15">
        <path d="M-40 250 H720 L820 350 H1140"/>
        <path d="M-40 1120 H360 L470 1010 H1140"/>
        <path d="M900 -40 V300 L1000 400 V1400"/>
        <path d="M150 -40 V180 L60 270 V1400"/>
        <path d="M-40 690 H1140" opacity=".7"/>
      </g>
      <g fill="#5499B5" opacity=".28">
        <circle cx="720" cy="250" r="4.5"/>
        <circle cx="820" cy="350" r="4.5"/>
        <circle cx="360" cy="1120" r="4.5"/>
        <circle cx="470" cy="1010" r="4.5"/>
        <circle cx="900" cy="300" r="4.5"/>
        <circle cx="1000" cy="400" r="4.5"/>
        <circle cx="150" cy="180" r="4.5"/>
      </g>
      <g stroke="#AFBCC9" stroke-width="1" opacity=".07">
        <path d="M-40 520 H1140"/>
        <path d="M-40 870 H1140"/>
      </g>
    </svg>

    <div class="vignette"></div>

    <div class="content">
      <div class="header">
        <div class="kicker"><span class="dot"></span><span>Valor Econômico &middot; PulseBrand</span></div>
        <h1 class="title"><b>4Selet</b> <i>na mídia</i></h1>
        <div class="rule"></div>
      </div>

      <div class="quote-wrap">
        <div class="bigquote" aria-hidden="true">&ldquo;</div>
        <p class="quote">Por que o produtor digital deixou de escolher plataforma de pagamento <em>pela taxa</em></p>
        <div class="attrib">
          <span class="line"></span>
          <span class="who"><b>Valor Econômico</b> &middot; PulseBrand</span>
        </div>
      </div>

      <div class="foot">
        <div class="thumb">
          <img src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/interface/public/uploads/valor_print.png" alt="Matéria do Valor Econômico">
          <div class="gloss"></div>
          <div class="tag">Na íntegra no Valor</div>
        </div>
        <div class="brand">
          <p class="note">A imprensa está de olho em <b>quem entende de pagamento</b>.</p>
          <img src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/assets/logo-4selet-light.png" alt="4Selet">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
