<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .card {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background:
      radial-gradient(128% 118% at 78% 6%, #006494 0%, #003554 45%, #07212B 100%);
    color: #fff;
  }

  /* subtle technology lines behind everything */
  .tech {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* fine top and bottom hairline rules that frame the whole piece */
  .edge-frame {
    position: absolute;
    inset: 40px;
    z-index: 2;
    border: 1px solid rgba(175, 188, 201, 0.16);
    border-radius: 6px;
    pointer-events: none;
  }
  .edge-frame::before,
  .edge-frame::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    border-color: rgba(84, 153, 181, 0.55);
    border-style: solid;
  }
  .edge-frame::before {
    top: -1px; left: -1px;
    border-width: 2px 0 0 2px;
    border-top-left-radius: 6px;
  }
  .edge-frame::after {
    bottom: -1px; right: -1px;
    border-width: 0 2px 2px 0;
    border-bottom-right-radius: 6px;
  }

  .content {
    position: relative;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 118px 100px 96px;
  }

  /* ---- Header block ---- */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #AFBCC9;
    margin-bottom: 30px;
  }
  .eyebrow .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #5499B5;
    box-shadow: 0 0 0 4px rgba(84, 153, 181, 0.14);
  }
  .eyebrow .rule {
    width: 46px;
    height: 1px;
    background: linear-gradient(90deg, rgba(175,188,201,0), rgba(175,188,201,0.7));
  }
  .eyebrow .rule.left {
    background: linear-gradient(90deg, rgba(175,188,201,0.7), rgba(175,188,201,0));
  }

  .title {
    font-size: 78px;
    line-height: 1.0;
    letter-spacing: -0.028em;
    text-align: center;
  }
  .title .brand { font-weight: 900; color: #ffffff; }
  .title .rest  { font-weight: 700; color: #5499B5; }

  .subtitle {
    margin-top: 22px;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.005em;
    color: #AFBCC9;
    text-align: center;
    max-width: 640px;
    line-height: 1.5;
  }

  /* ---- Matéria card (perfectly straight) ---- */
  .stage {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 8px;
  }

  .frame {
    position: relative;
    width: 540px;
    padding: 14px;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(84,153,181,0.30), rgba(0,53,84,0.10) 55%, rgba(7,33,43,0.35));
    box-shadow:
      0 44px 90px -30px rgba(0, 0, 0, 0.68),
      0 0 0 1px rgba(175, 188, 201, 0.14),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  .frame .paper {
    position: relative;
    width: 512px;
    height: 640px;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }
  .frame .paper img.materia {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  /* faint glass sheen — diagonal, non-distorting */
  .frame .paper .sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(118deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 34%);
    pointer-events: none;
  }

  /* source tab clipped to the top edge of the card */
  .source-tab {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 15px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #07212B;
    background: rgba(217, 220, 214, 0.94);
    border-radius: 8px;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.5);
  }
  .source-tab .live {
    width: 6px; height: 6px; border-radius: 50%;
    background: #006494;
  }

  /* ---- Seal (top-right of the card, overlapping) ---- */
  .seal {
    position: absolute;
    top: -8px;
    right: -30px;
    z-index: 5;
    width: 158px;
    height: 158px;
    filter: drop-shadow(0 16px 30px rgba(0,0,0,0.45));
  }

  /* ---- Footer ---- */
  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-top: 6px;
  }
  .footer .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, rgba(175,188,201,0), rgba(175,188,201,0.45), rgba(175,188,201,0));
  }
  .footer img.logo {
    height: 46px;
    width: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="card">

    <svg class="tech" viewBox="0 0 1080 1350" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#5499B5" stroke-width="1" fill="none" opacity="0.15">
        <path d="M0 250 H360 L440 330 H1080"/>
        <path d="M0 1120 H300 L380 1040 H1080"/>
        <path d="M980 0 V180 L900 260 V640"/>
        <path d="M120 0 V120 L60 180 V520"/>
        <path d="M1080 900 H760 L700 960 V1350"/>
      </g>
      <g fill="#5499B5" opacity="0.22">
        <circle cx="440" cy="330" r="4"/>
        <circle cx="380" cy="1040" r="4"/>
        <circle cx="900" cy="260" r="4"/>
        <circle cx="60" cy="180" r="4"/>
        <circle cx="700" cy="960" r="4"/>
      </g>
      <g stroke="#AFBCC9" stroke-width="1" fill="none" opacity="0.06">
        <circle cx="880" cy="150" r="220"/>
        <circle cx="180" cy="1200" r="180"/>
      </g>
    </svg>

    <div class="edge-frame"></div>

    <div class="content">

      <div class="eyebrow">
        <span class="rule left"></span>
        <span>Valor Econômico</span>
        <span class="dot"></span>
        <span>PulseBrand</span>
        <span class="rule"></span>
      </div>

      <h1 class="title">
        <span class="brand">4Selet</span> <span class="rest">na mídia</span>
      </h1>

      <p class="subtitle">Nossa atuação em pagamentos ganha destaque na imprensa de negócios.</p>

      <div class="stage">
        <div class="frame">

          <div class="source-tab">
            <span class="live"></span>
            <span>Na imprensa</span>
          </div>

          <svg class="seal" viewBox="0 0 158 158" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <path id="arcTop" d="M 79 79 m -55 0 a 55 55 0 1 1 110 0" fill="none"/>
              <path id="arcBot" d="M 79 79 m 55 0 a 55 55 0 1 1 -110 0" fill="none"/>
            </defs>
            <circle cx="79" cy="79" r="76" fill="#07212B"/>
            <circle cx="79" cy="79" r="76" fill="none" stroke="#5499B5" stroke-width="1" opacity="0.55"/>
            <circle cx="79" cy="79" r="68" fill="none" stroke="#5499B5" stroke-width="1" opacity="0.28"/>
            <circle cx="79" cy="79" r="47" fill="none" stroke="#AFBCC9" stroke-width="1" opacity="0.35"/>
            <text font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="3.4" fill="#AFBCC9">
              <textPath href="#arcTop" startOffset="50%" text-anchor="middle">DESTAQUE NA</textPath>
            </text>
            <text font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="3.4" fill="#AFBCC9">
              <textPath href="#arcBot" startOffset="50%" text-anchor="middle">IMPRENSA</textPath>
            </text>
            <g fill="#5499B5">
              <circle cx="30" cy="79" r="2"/>
              <circle cx="128" cy="79" r="2"/>
            </g>
            <text x="79" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="30" fill="#ffffff">4</text>
            <text x="79" y="98" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="9" letter-spacing="2.5" fill="#5499B5">2026</text>
          </svg>

          <div class="paper">
            <img class="materia" src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/interface/public/uploads/valor_print.png" alt="Matéria do Valor Econômico sobre a 4Selet">
            <div class="sheen"></div>
          </div>

        </div>
      </div>

      <div class="footer">
        <div class="divider"></div>
        <img class="logo" src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/assets/logo-4selet-light.png" alt="4Selet">
      </div>

    </div>
  </div>
</body>
</html>
