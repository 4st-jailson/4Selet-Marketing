<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: radial-gradient(128% 118% at 78% 6%, #006494 0%, #003554 45%, #07212B 100%);
  }

  /* ---- fine technology lines (subtle) ---- */
  .tech-lines {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* ---- soft ambient glow to seat the stack ---- */
  .ambient {
    position: absolute;
    left: 50%;
    top: 730px;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 720px;
    z-index: 1;
    background: radial-gradient(50% 50% at 50% 50%, rgba(84,153,181,0.20) 0%, rgba(84,153,181,0.06) 45%, rgba(84,153,181,0) 72%);
    pointer-events: none;
  }

  /* =========== HEADER =========== */
  .header {
    position: absolute;
    top: 96px;
    left: 0;
    right: 0;
    z-index: 5;
    text-align: center;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #AFBCC9;
    margin-bottom: 22px;
  }
  .eyebrow .dot {
    color: #5499B5;
    margin: 0 10px;
  }
  .title {
    font-size: 84px;
    line-height: 0.98;
    letter-spacing: -2px;
  }
  .title .brand {
    font-weight: 900;
    color: #ffffff;
  }
  .title .rest {
    font-weight: 700;
    color: #5499B5;
  }
  .title-rule {
    width: 92px;
    height: 3px;
    margin: 34px auto 0;
    background: linear-gradient(90deg, rgba(84,153,181,0) 0%, #5499B5 50%, rgba(84,153,181,0) 100%);
    border-radius: 3px;
  }

  /* =========== LAYERED STACK =========== */
  .stack {
    position: absolute;
    left: 50%;
    top: 388px;
    width: 720px;
    height: 800px;
    transform: translateX(-50%);
    z-index: 4;
  }

  /* generic card frame (perfectly rectangular device) */
  .layer {
    position: absolute;
    background: linear-gradient(150deg, #12181d 0%, #080b0e 100%);
    border-radius: 26px;
    padding: 14px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.05) inset,
      0 0 0 1px rgba(84,153,181,0.16),
      0 40px 80px -20px rgba(0,0,0,0.72);
  }
  .layer .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;
  }
  .layer .screen img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  /* diagonal glass reflection */
  .layer .glass {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(118deg,
      rgba(255,255,255,0.20) 0%,
      rgba(255,255,255,0.06) 16%,
      rgba(255,255,255,0) 34%,
      rgba(255,255,255,0) 100%);
  }

  /* BACK layer — the photo of the article */
  .layer.back {
    width: 396px;
    height: 528px;
    right: 26px;
    top: 6px;
    transform: rotate(4deg);
    z-index: 1;
    opacity: 0.98;
  }
  /* subtle darkening scrim on the back layer so the front reads first */
  .layer.back .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(180deg, rgba(7,33,43,0.10) 0%, rgba(7,33,43,0.30) 100%);
  }
  /* back card zooms into the article PHOTO (Fabricio) so the two layers
     tell a headline + photo story — still a perfect rectangle, no warp */
  .layer.back .screen img {
    object-fit: cover;
    object-position: center 60%;
    transform: scale(1.72);
    transform-origin: center 60%;
  }

  /* FRONT layer — the headline of the article */
  .layer.front {
    width: 452px;
    height: 604px;
    left: 22px;
    top: 168px;
    transform: rotate(-4deg);
    z-index: 2;
  }
  .layer.front .screen img {
    object-position: top center;
  }

  /* "cobertura na imprensa" caption chip floating over the stack */
  .press-chip {
    position: absolute;
    z-index: 5;
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 13px 26px;
    background: rgba(0,53,84,0.72);
    border: 1px solid rgba(84,153,181,0.42);
    border-radius: 100px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 18px 40px -14px rgba(0,0,0,0.65);
  }
  .press-chip .pulse {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #5499B5;
    box-shadow: 0 0 0 4px rgba(84,153,181,0.22);
  }
  .press-chip .txt {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #D9DCD6;
  }

  /* =========== FOOTER / LOGO =========== */
  .footer {
    position: absolute;
    bottom: 74px;
    left: 0;
    right: 0;
    z-index: 6;
    text-align: center;
  }
  .footer .logo {
    height: 46px;
    width: auto;
    display: inline-block;
    opacity: 0.98;
  }
  .footer .tagline {
    margin-top: 18px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.4px;
    color: #AFBCC9;
  }

  /* corner index marks (mono, discreet) */
  .corner {
    position: absolute;
    z-index: 5;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 2px;
    color: rgba(175,188,201,0.42);
  }
  .corner.tl { top: 60px; left: 68px; }
  .corner.tr { top: 60px; right: 68px; }
</style>
</head>
<body>
  <div class="card">

    <!-- fine technology grid lines -->
    <svg class="tech-lines" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#5499B5" stroke-width="1" opacity="0.15">
        <path d="M0 250 H1080" />
        <path d="M0 1160 H1080" />
        <path d="M150 0 V1350" />
        <path d="M930 0 V1350" />
        <path d="M-40 470 L360 470 L470 360" />
        <path d="M1120 900 L720 900 L610 1010" />
      </g>
      <g stroke="#5499B5" stroke-width="1" opacity="0.10">
        <path d="M0 200 L1080 340" />
        <path d="M0 1250 L1080 1120" />
      </g>
      <g fill="#5499B5" opacity="0.5">
        <circle cx="150" cy="250" r="3.5" />
        <circle cx="930" cy="250" r="3.5" />
        <circle cx="150" cy="1160" r="3.5" />
        <circle cx="930" cy="1160" r="3.5" />
      </g>
      <g fill="#5499B5" opacity="0.28">
        <circle cx="470" cy="360" r="3" />
        <circle cx="610" cy="1010" r="3" />
      </g>
    </svg>

    <div class="ambient"></div>

    <!-- corner index marks -->
    <div class="corner tl">IMPRENSA</div>
    <div class="corner tr">2026</div>

    <!-- header -->
    <div class="header">
      <div class="eyebrow">VALOR ECONÔMICO<span class="dot">·</span>PULSEBRAND</div>
      <h1 class="title"><span class="brand">4Selet</span> <span class="rest">na mídia</span></h1>
      <div class="title-rule"></div>
    </div>

    <!-- layered stack of two upright cards -->
    <div class="stack">

      <!-- BACK: article photo -->
      <div class="layer back">
        <div class="screen">
          <img src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/interface/public/uploads/valor_print.png" alt="Foto da matéria">
          <div class="glass"></div>
        </div>
      </div>

      <!-- FRONT: article headline -->
      <div class="layer front">
        <div class="screen">
          <img src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/interface/public/uploads/valor_print.png" alt="Manchete da matéria">
          <div class="glass"></div>
        </div>
      </div>

      <!-- press coverage chip -->
      <div class="press-chip">
        <span class="pulse"></span>
        <span class="txt">Cobertura na imprensa</span>
      </div>

    </div>

    <!-- footer / logo -->
    <div class="footer">
      <img class="logo" src="file:///C:/Users/Administrator/Documents/Agentes_Marketing_4Selet/Claude Equipe de Marketing - 6 Agentes/assets/logo-4selet-light.png" alt="4Selet">
      <div class="tagline">Para quem sabe que é Selet.</div>
    </div>

  </div>
</body>
</html>
