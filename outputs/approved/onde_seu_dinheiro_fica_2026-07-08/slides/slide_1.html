<!DOCTYPE html><html lang="pt-BR" data-ab-filters-channel="ad3db622-a280-442a-a139-b54a41c1fd2d"><head><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  .card {
    position:relative; width:1080px; height:1350px; overflow:hidden;
    background: linear-gradient(160deg, #003554 0%, #07212B 100%);
    color:#D9DCD6; font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* wash de marca: da unidade navy a qualquer foto */
  .wash { position:absolute; inset:0;
    background: linear-gradient(160deg, #00355459 0%, #07212B26 45%, #07212B80 100%); }
  /* scrim inferior: garante leitura da copy sobre a foto */
  .scrim { position:absolute; inset:0;
    background: linear-gradient(0deg, #07212Bf2 0%, #07212Bd9 14%, #07212B00 54%); }
  .top { position:relative; display:flex; align-items:center; justify-content:space-between; padding:80px 88px 0; }
  .logo { height:50px; filter:drop-shadow(0 2px 10px rgba(0,0,0,.45)); }
  .badge { font-family:'JetBrains Mono',monospace; font-size:28px; letter-spacing:1px;
    color:#07212B; background:#5499B5; padding:9px 22px; border-radius:999px; font-weight:500; }
  .content { position:relative; padding:0 88px 84px; display:flex; flex-direction:column; }
  .eyebrow { font-family:'JetBrains Mono',monospace; color:#5499B5;
    font-size:30px; letter-spacing:3px; text-transform:uppercase; margin-bottom:24px;
    text-shadow:0 2px 12px rgba(0,0,0,.5); }
  .headline { font-weight:700; font-size:84px; line-height:1.0;
    color:#FFFFFF; letter-spacing:-2px; text-shadow:0 3px 22px rgba(0,0,0,.55); }
  .headline .accent { color:#5499B5; font-weight:900; }
  .subtext { margin-top:26px; font-size:38px; line-height:1.3; color:#D9DCD6;
    max-width:90%; font-weight:400; text-shadow:0 2px 14px rgba(0,0,0,.5); }
  .bottom { margin-top:40px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .cta { font-weight:800; font-size:34px;
    background:#006494; color:#FFFFFF; padding:24px 46px; border-radius:999px; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  .footer { font-family:'JetBrains Mono',monospace; font-size:24px; color:#AFBCC9; text-shadow:0 2px 10px rgba(0,0,0,.5); }
</style><link id="he-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bebas+Neue&amp;family=Playfair+Display:wght@400;700;900&amp;display=swap"><link id="he-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bebas+Neue&amp;family=Playfair+Display:wght@400;700;900&amp;display=swap"><link id="he-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bebas+Neue&amp;family=Playfair+Display:wght@400;700;900&amp;display=swap"><link id="he-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bebas+Neue&amp;family=Playfair+Display:wght@400;700;900&amp;display=swap"><link id="he-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bebas+Neue&amp;family=Playfair+Display:wght@400;700;900&amp;display=swap"></head>
<body><div class="card">
