<!-- TESTE / DRY-RUN - nao publicar. Ad Creative Designer (simulado). Contrato atual: CSS inline, html/body com dimensoes, .card, span.cta. -->
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; }
      .card {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(120% 120% at 80% 10%, #006494 0%, #003554 42%, #07212B 100%);
        color: #D9DCD6;
        font-family: "Inter", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 96px 92px;
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#5499B522 2px, transparent 2px);
        background-size: 46px 46px;
        opacity: 0.5;
      }
      .top { position: relative; display: flex; align-items: center; justify-content: space-between; }
      .logo { height: 54px; }
      .badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 30px;
        letter-spacing: 1px;
        color: #07212B;
        background: #5499B5;
        padding: 10px 22px;
        border-radius: 999px;
        font-weight: 500;
      }
      .mid { position: relative; }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        color: #5499B5;
        font-size: 32px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 30px;
      }
      .headline { font-weight: 700; font-size: 168px; line-height: 0.98; color: #FFFFFF; letter-spacing: -2px; }
      .headline .accent { color: #5499B5; font-weight: 900; }
      .subtext { margin-top: 36px; font-size: 40px; line-height: 1.34; color: #AFBCC9; max-width: 90%; font-weight: 400; }
      .bottom { position: relative; display: flex; align-items: center; justify-content: space-between; }
      .cta {
        font-weight: 800;
        font-size: 36px;
        background: #006494;
        color: #FFFFFF;
        padding: 26px 48px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dots"></div>
      <div class="top">
        <img class="logo" src="../../../../assets/logo-4selet-light.png" alt="4Selet" />
        <span class="badge">TESTE · DRY-RUN</span>
      </div>
      <div class="mid">
        <div class="eyebrow">CAMPANHA TAXA ZERO</div>
        <div class="headline"><span class="accent">0%</span> de taxa.</div>
        <div class="subtext">
          Por 3 meses ou até R$ 300 mil em vendas. R$ 1,99 por transação. PIX em D+10.
        </div>
      </div>
      <div class="bottom">
        <span class="cta">Solicitar convite →</span>
      </div>
    </div>
  </body>
</html>
